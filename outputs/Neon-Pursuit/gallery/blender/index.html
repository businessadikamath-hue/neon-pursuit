<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Pursuit · Ultra Showcase</title><style>
html,body{margin:0;background:#05070a;color:#ecf7ff;font:14px system-ui,sans-serif;min-height:100%;display:grid;place-items:center}main{width:min(1280px,96vw);padding:24px 0 36px}h1{font-weight:500;letter-spacing:.12em;text-transform:uppercase;font-size:16px;margin:0 0 12px;color:#9feaff}figure{margin:0;background:#0b1117;border:1px solid #214253;box-shadow:0 18px 60px #000b;overflow:hidden;position:relative}#stage{position:relative;aspect-ratio:16/9;background:#071016;overflow:hidden}#stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:4;background:#071016}#stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}figcaption{padding:12px 16px;color:#9cb0bb;display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap}.bar{display:flex;gap:10px;align-items:center;margin-top:14px}input[type=range]{flex:1;accent-color:#14d9ff}button{background:#0e2630;border:1px solid #1aa9c7;color:#dbf9ff;padding:8px 12px;cursor:pointer}a{color:#ff74c8;text-decoration:none}.badge{position:absolute;top:14px;left:14px;z-index:3;padding:7px 10px;background:#06151dcc;border:1px solid #54dff766;color:#bdf6ff;font-size:10px;letter-spacing:1.6px}
</style></head><body><main><h1>Neon Pursuit · Ultra showcase</h1><figure><div id="stage"><span class="badge">ULTRA+ / 120 FPS DEMO · 4 WORLDS</span><video id="previewVideo" controls preload="metadata" playsinline src="ultra-120fps-preview.webm" aria-label="Ultra 120 fps preview"></video><img id="a" src="frames/frame_0001.png" alt="Ultra quality Neon Pursuit rendered run"><img id="b" src="frames/frame_0002.png" alt="Ultra quality Neon Pursuit rendered run" style="opacity:0"></div><figcaption><span id="counter">0.0 s / 20.0 s · 120 fps target · four environments · frequent car changes</span><span><a href="ultra-120fps-preview.webm">DOWNLOAD 120 FPS PREVIEW</a> · Hero still: <a href="hero-still.png">hero-still.png</a></span></figcaption></figure><div class="bar"><button id="play">PLAY ULTRA</button><input id="scrub" type="range" min="0" max="20000" value="0" step="1" aria-label="Showcase timeline"><button id="loop">LOOP ON</button></div></main><script>
const A=document.getElementById('a'),B=document.getElementById('b'),scrub=document.getElementById('scrub'),counter=document.getElementById('counter'),play=document.getElementById('play'),loop=document.getElementById('loop'),N=48,D=20000;let running=false,loopOn=true,started=0,elapsed=0,raf=0,active=0;const cache=Array.from({length:N},(_,i)=>{const im=new Image();im.src='frames/frame_'+String(i+1).padStart(4,'0')+'.png';return im});
function draw(ms){const pos=Math.max(0,Math.min(D,ms))/D*(N-1),i=Math.floor(pos),f=pos-i,next=Math.min(N-1,i+1),front=active===0?A:B,back=active===0?B:A;if(front.dataset.frame!==String(i+1)){front.src=cache[i].src;front.dataset.frame=String(i+1)}if(back.dataset.frame!==String(next+1)){back.src=cache[next].src;back.dataset.frame=String(next+1)}front.style.opacity=String(1-f);back.style.opacity=String(f);active=active;const env=['COASTLINE','TUNDRA','DESERT','JUNGLE'][Math.min(3,Math.floor(ms/5000))];const car=['McLaren 720S','Jesko Attack','Aston Martin DB12','GR Yaris','Mustang GT'][Math.floor(ms/900)%5];counter.textContent=(ms/1000).toFixed(1)+' s / 20.0 s · 120 fps target · '+env+' · '+car+' · 48 rendered keyframes';scrub.value=Math.round(ms)}
function tick(now){if(!running)return;if(!started)started=now-elapsed;elapsed=now-started;if(elapsed>D){if(loopOn){started=now;elapsed=0}else{elapsed=D;running=false;play.textContent='PLAY ULTRA'}}draw(elapsed);raf=requestAnimationFrame(tick)}
play.onclick=()=>{running=!running;play.textContent=running?'PAUSE':'PLAY ULTRA';if(running){started=performance.now()-elapsed;raf=requestAnimationFrame(tick)}else cancelAnimationFrame(raf)};loop.onclick=()=>{loopOn=!loopOn;loop.textContent=loopOn?'LOOP ON':'LOOP OFF'};scrub.oninput=()=>{elapsed=+scrub.value;started=performance.now()-elapsed;draw(elapsed)};draw(0);
</script></body></html>
