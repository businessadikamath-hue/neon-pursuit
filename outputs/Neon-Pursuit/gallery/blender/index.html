<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Pursuit · Blender Cinematic</title>
<style>
html,body{margin:0;background:#05070a;color:#ecf7ff;font:14px system-ui,sans-serif;min-height:100%;display:grid;place-items:center}
main{width:min(1280px,96vw);padding:24px 0 36px}h1{font-weight:500;letter-spacing:.12em;text-transform:uppercase;font-size:16px;margin:0 0 12px;color:#9feaff}figure{margin:0;background:#0b1117;border:1px solid #214253;box-shadow:0 18px 60px #000b;overflow:hidden}img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}figcaption{padding:12px 16px;color:#9cb0bb;display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap}.bar{display:flex;gap:10px;align-items:center;margin-top:14px}input[type=range]{flex:1;accent-color:#14d9ff}button{background:#0e2630;border:1px solid #1aa9c7;color:#dbf9ff;padding:8px 12px;cursor:pointer}a{color:#ff74c8;text-decoration:none}
</style>
</head>
<body><main><h1>Neon Pursuit · Blender Ultra+ cinematic</h1><figure><img id="frame" src="frames/frame_0001.png" alt="Blender rendered Neon Pursuit hero scene"><figcaption><span id="counter">Frame 1 / 48 · 24 fps · 1280×720 lossless PNG sequence</span><span>High resolution still: <a href="hero-still.png">hero-still.png</a> · Model: <a href="hero-blender-ultraplus.glb">GLB</a> · Scene: <a href="neon-pursuit-blender-cinematic.blend">.blend</a></span></figcaption></figure><div class="bar"><button id="play">PLAY</button><input id="scrub" type="range" min="1" max="48" value="1" step="1"><button id="loop">LOOP ON</button></div></main>
<script>
const img=document.getElementById('frame'),scrub=document.getElementById('scrub'),counter=document.getElementById('counter'),play=document.getElementById('play'),loop=document.getElementById('loop');let frame=1,running=false,handle=0,loopOn=true;
function pad(n){return String(n).padStart(4,'0')}function show(n){frame=Math.max(1,Math.min(48,n));scrub.value=frame;img.src=`frames/frame_${pad(frame)}.png`;counter.textContent=`Frame ${frame} / 48 · 24 fps · 1280×720 lossless PNG sequence`}function tick(){if(!running)return;show(frame===48?(loopOn?1:48):frame+1);handle=setTimeout(tick,1000/24)}scrub.oninput=()=>show(+scrub.value);play.onclick=()=>{running=!running;play.textContent=running?'PAUSE':'PLAY';if(running)tick();else clearTimeout(handle)};loop.onclick=()=>{loopOn=!loopOn;loop.textContent=loopOn?'LOOP ON':'LOOP OFF'};show(1);
</script></body></html>
