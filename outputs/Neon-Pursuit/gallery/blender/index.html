<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Pursuit · Ultra+ Demo</title><style>html,body{margin:0;background:#05070a;color:#ecf7ff;font:14px system-ui,sans-serif;min-height:100%;display:grid;place-items:center}main{width:min(1280px,96vw);padding:24px 0 36px}h1{font-weight:500;letter-spacing:.12em;text-transform:uppercase;font-size:16px;margin:0 0 12px;color:#9feaff}figure{margin:0;background:#0b1117;border:1px solid #214253;box-shadow:0 18px 60px #000b;overflow:hidden}#stage{position:relative;aspect-ratio:16/9;background:#071016;overflow:hidden}#stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#071016}#v1{z-index:1}#v2{z-index:2;transform:translateX(100%)}#stage.slide-in #v2{animation:slideIn .55s cubic-bezier(.22,.72,.24,1) forwards}@keyframes slideIn{to{transform:translateX(0)}}.badge{position:absolute;top:14px;left:14px;z-index:4;padding:7px 10px;background:#06151dcc;border:1px solid #54dff766;color:#bdf6ff;font-size:10px;letter-spacing:1.6px}.meta{padding:12px 16px;color:#9cb0bb;display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap}.chooser{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:14px}.chooser strong{font-size:10px;letter-spacing:1.5px;color:#9feaff}.chooser button{background:#0e2630;border:1px solid #1aa9c7;color:#dbf9ff;padding:8px 12px;cursor:pointer}.chooser button.active{background:#176176;border-color:#b8f7ff;box-shadow:0 0 18px #1aa9c766}.lock{font-size:10px;color:#9cb0bb;margin-top:11px}a{color:#ff74c8;text-decoration:none}</style></head><body><main><h1>Neon Pursuit · Ultra+ Demo</h1><figure><div id="stage"><span class="badge">PRE-RECORDED ULTRA+ GAMEPLAY · 120 FPS TARGET</span><video id="v1" autoplay muted playsinline controls src="coastline-mclaren.webm"></video><video id="v2" muted playsinline></video></div><div class="meta"><span id="status">COASTLINE · BLACK MCLAREN 720S · 5 SECOND CLIP</span><span><a href="coastline-mclaren.webm" id="download">DOWNLOAD CLIP</a></span></div></figure><div class="chooser"><strong>BACKGROUND</strong><button class="active" data-env="coastline" data-src="coastline-mclaren.webm" data-label="COASTLINE · BLACK MCLAREN 720S">COASTLINE</button><button data-env="tundra" data-src="tundra-jesko.webm" data-label="TUNDRA · RED JESKO ATTACK">TUNDRA</button><button data-env="desert" data-src="desert-aston.webm" data-label="DESERT · SILVER DB12">DESERT</button><button data-env="jungle" data-src="jungle-mustang.webm" data-label="JUNGLE · BLUE MUSTANG GT">JUNGLE</button></div><div class="chooser"><strong>DEMO CAR</strong><button data-env="coastline" data-src="coastline-mclaren.webm" data-label="COASTLINE · BLACK MCLAREN 720S">BLACK MCLAREN</button><button data-env="tundra" data-src="tundra-jesko.webm" data-label="TUNDRA · RED JESKO ATTACK">RED JESKO</button><button data-env="desert" data-src="desert-aston.webm" data-label="DESERT · SILVER DB12">SILVER DB12</button><button data-env="jungle" data-src="jungle-mustang.webm" data-label="JUNGLE · BLUE MUSTANG GT">BLUE MUSTANG</button></div><div class="lock">Locked pre-recorded showcase · no editing · each selection plays an installed Ultra+ gameplay clip.</div></main><script>const stage=document.getElementById('stage'),a=document.getElementById('v1'),b=document.getElementById('v2'),status=document.getElementById('status'),download=document.getElementById('download');let front=a;document.querySelectorAll('button[data-src]').forEach(btn=>btn.onclick=()=>{if(btn.classList.contains('active'))return;document.querySelectorAll('button[data-src]').forEach(x=>x.classList.remove('active'));btn.classList.add('active');const back=front===a?b:a;back.src=btn.dataset.src;back.currentTime=0;back.play().catch(()=>{});stage.classList.remove('slide-in');void stage.offsetWidth;stage.classList.add('slide-in');setTimeout(()=>{front.pause();front.removeAttribute('src');front.load();front=back;stage.classList.remove('slide-in');status.textContent=btn.dataset.label+' · 5 SECOND CLIP';download.href=btn.dataset.src},600)});a.addEventListener('ended',()=>a.currentTime=0);b.addEventListener('ended',()=>b.currentTime=0);</script></body></html>
